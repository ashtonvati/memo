services:
  web:
    build: .
    command: python -m moment_backend.web
    env_file: ${MOMENT_ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - moment-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    build: .
    command: python -m moment_backend.worker
    env_file: ${MOMENT_ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
    volumes:
      - moment-data:/data
    restart: unless-stopped

volumes:
  moment-data:
